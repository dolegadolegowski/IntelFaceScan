#
# Builds the patched librealsense SDK (cached), the RealSense camera service daemon, the camera helper and the Swift
# package, runs the test suites (no camera: synthetic data and generated datasets; the camera service is never
# installed on the runner: its installer runs as dry runs into a temporary folder), smoke-tests ifscan, builds the
# app with scripts/build.sh and smoke-tests the bundle (signature, bundled helper, librealsense and camera service
# files, no absolute build paths).
# Read-only token, no secrets: safe for pull requests from forks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Apple Silicon, Xcode 27)
    # Since Xcode 27, GitHub names its macOS images after the major Xcode version instead of the OS: there is no
    # "macos-27" label. "xcode-27" is the generally available (2026-10-15) GitHub-hosted image with macOS 27 and the
    # Xcode 27.x toolchains, Apple Silicon only ("xcode-27-xlarge" is the paid larger variant of the same image).
    # In its October 2026 releases the image reports macOS 27.0.1 with Xcode 27.0, 27.1 and 27.2 installed, so the
    # job selects the newest Xcode 27 (the macOS 27.2 SDK matches the package's deployment target) and warns while
    # the image's macOS is older than the 27.2 the app requires to run. Nothing here needs a camera or root.
    # (actionlint <= 1.7.12 does not know the xcode-* labels yet and reports them as unknown.)
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "27.2"
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Select the newest Xcode 27
        run: |
          set -euo pipefail
          # Prefer released Xcodes; fall back to a beta/RC only when no release is installed.
          candidates="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V)"
          xcode="$(printf '%s\n' "$candidates" | grep -viE 'beta|_rc|release_candidate' | tail -n 1 || true)"
          [ -n "$xcode" ] || xcode="$(printf '%s\n' "$candidates" | tail -n 1)"
          if [ -n "$xcode" ]; then
            sudo xcode-select --switch "$xcode/Contents/Developer"
          fi
          echo "Xcode: $(xcode-select -p)"
          xcodebuild -version
          swift --version
          cmake --version | head -n 1
          os="$(sw_vers -productVersion)"
          echo "macOS $os ($(uname -m)), $(sysctl -n hw.ncpu) cores, $(($(sysctl -n hw.memsize) / 1073741824)) GB memory"
          if [ "$(printf '%s\n27.2\n' "$os" | sort -V | head -n 1)" != "27.2" ]; then
            echo "::warning::The runner image runs macOS $os; IntelFaceScan targets macOS 27.2+ (tests still run here)."
          fi

      - name: Test the SDK bookkeeping of the build scripts (patch versions, input stamp)
        run: scripts/test-build-scripts.sh

      # The SDK build takes most of the job: cache build/sdk/install keyed on the librealsense submodule commit, the
      # patches (patches/ and the camera service client in the vendored kit) and the build scripts. Restore and save
      # are separate steps so a failing test does not lose the cache. The install carries build-sdk.sh's input stamp
      # (.ifs-sdk-inputs: the same commit, patches and script), so a restored SDK counts as current without any file
      # time games, and the static libusb the camera service daemon is linked against (install/libusb).
      - name: Compute the SDK cache key
        id: sdk-key
        run: |
          set -euo pipefail
          echo "librealsense=$(git rev-parse HEAD:third_party/librealsense)" >> "$GITHUB_OUTPUT"
      - name: Restore the librealsense build
        id: sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: build/sdk/install
          key: librealsense-v1-${{ runner.os }}-${{ runner.arch }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ steps.sdk-key.outputs.librealsense }}-${{ hashFiles('patches/**', 'third_party/realsense-usbd/librealsense/**', 'scripts/build-sdk.sh', 'scripts/apply-patches.sh') }}
      - name: Build librealsense 2.58.4 with the macOS patches and the camera service client
        env:
          SDK_CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p build/ci
          scripts/build-sdk.sh | tee build/ci/build-sdk.log
          if [ "$SDK_CACHE_HIT" = "true" ] && ! grep -q '^librealsense already built' build/ci/build-sdk.log; then
            echo "::error::build-sdk.sh rebuilt the SDK restored from the cache (its input stamp disagrees with the cache key)"
            exit 1
          fi
      - name: Save the librealsense build
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/sdk/install
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      # The RealSense camera service the app carries (third_party/realsense-usbd, a copy of the kit whose home is
      # realsense-viewer-macos): the kit's script builds the daemon against the static libusb of the SDK install, the
      # way scripts/build.sh does. The daemon's own tests run in the kit's repository; here the kit's test of what an
      # application ships and runs: the installer, the uninstaller, the manifest script and ensure-camera-access.sh
      # --check, without root (dry runs into a temporary folder; nothing is installed on the runner).
      - name: Build the camera service daemon (realsense-usbd)
        run: |
          set -euo pipefail
          third_party/realsense-usbd/build-daemon.sh build/usbd \
            --libusb "$PWD/build/sdk/install/libusb/lib/libusb-1.0.a" \
            --librealsense-src third_party/librealsense \
            --deployment-target "$MACOSX_DEPLOYMENT_TARGET" --daemon-only
          build/usbd/realsense-usbd --version
      - name: Test the camera service installer scripts (dry runs, no root)
        run: third_party/realsense-usbd/tests/test-camera-access.sh build/usbd/realsense-usbd

      - name: Build the camera helper
        run: |
          set -euo pipefail
          cmake -S helper -B build/helper -DCMAKE_BUILD_TYPE=Release \
            -DIFS_SDK_DIR="$PWD/build/sdk/install" -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DIFS_HELPER_TESTS=ON
          cmake --build build/helper -j "$(sysctl -n hw.ncpu)"

      # capture-tests: the capture engine on synthetic recordings. helper-tests: the recording spool, and the helper
      # binary itself run as the runner's user: command line, exit status, and a live session without a camera (the
      # camera service path: no root, no USB re-enumeration).
      - name: Run the helper tests (no camera, no root)
        run: ctest --test-dir build/helper --output-on-failure

      - name: Build the Swift package
        id: swift-build
        run: swift build

      # NSUnbufferedIO: the test runners' output reaches the log as it happens (a pipe is block-buffered otherwise, so
      # a slow or stuck test would not show). Every 2 minutes a folded group logs swap, memory pressure and the
      # busiest processes, so a slow or stuck run shows what the machine was doing. The step limit leaves time for the
      # smoke tests and the app build.
      - name: Run the tests
        timeout-minutes: 40
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -euo pipefail
          (
            while sleep 120; do
              echo "::group::machine $(date -u +%H:%M:%S)"
              sysctl -n vm.swapusage || true
              memory_pressure -Q 2>/dev/null | tail -n 1 || true
              ps -Ao pid,pcpu,rss,etime,comm -r | head -n 8 || true
              echo "::endgroup::"
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          scripts/test.sh

      # A test step that timed out can leave swift test running: it holds the .build lock (every later swift build
      # would wait for it) and the CPU.
      - name: Stop leftover test processes
        if: ${{ !cancelled() }}
        run: |
          pkill -TERM -f swiftpm-testing-helper || true
          pkill -TERM -x swift-test || true
          sleep 2
          pkill -KILL -f swiftpm-testing-helper || true
          pkill -KILL -x swift-test || true

      # The smoke tests and the app build do not depend on the test results: they also run when a test failed (the job
      # still fails), so one run reports both. They need everything up to the Swift build.
      - name: Smoke-test ifscan on a synthetic scan
        if: ${{ !cancelled() && steps.swift-build.outcome == 'success' }}
        run: |
          set -euo pipefail
          ifscan="$(swift build --show-bin-path)/ifscan"
          "$ifscan" synth -o build/ci/synthetic.ifsdataset --width 640 --height 400 --gt-mesh build/ci/ground_truth.obj
          "$ifscan" info build/ci/synthetic.ifsdataset
          "$ifscan" info build/ci/ground_truth.obj

      # The documented one-command build (docs/ARCHITECTURE.md, "Build"): its tool checks, the SDK (restored above),
      # the camera service daemon, the helper, the release Swift build and the app bundle.
      - name: Build the app with scripts/build.sh
        id: app
        if: ${{ !cancelled() && steps.swift-build.outcome == 'success' }}
        run: scripts/build.sh

      - name: Smoke-test the app bundle (bundled helper, librealsense, camera service and ifscan)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: |
          set -euo pipefail
          app="$PWD/build/IntelFaceScan.app"
          mkdir -p build/ci/bundle
          codesign --verify --strict --deep "$app"
          otool -L "$app/Contents/Helpers/IntelFaceScanHelper" > build/ci/helper-libs.txt
          grep -q '@rpath/librealsense2' build/ci/helper-libs.txt
          "$app/Contents/Helpers/IntelFaceScanHelper" --version
          # The camera service as the app finds it (scripts/bundle-app.sh already checked the manifest against the
          # signed daemon): the files, the daemon's version line, and the two things the app does with them. The
          # check asks the bundled daemon about the installed service: none on the runner, exit status 10 (--check
          # never installs and never asks for a password). The installer, called with the sources the app passes,
          # accepts the bundled daemon and manifest in a dry run into a folder; a runner whose folders fail the
          # installer's trust rule would end it with status 3 after writing the same files, which is not this
          # bundle's fault.
          usbd="$app/Contents/Helpers/realsense-usbd"
          kit="$app/Contents/Resources/realsense-usbd"
          label=io.github.dolegadolegowski.realsense-usbd
          "$usbd" --version | tee build/ci/usbd-version.txt
          grep -Eq '^realsense-usbd [0-9]+ protocol [0-9]+-[0-9]+$' build/ci/usbd-version.txt
          for f in install-camera-access.sh uninstall-camera-access.sh ensure-camera-access.sh; do
            test -x "$kit/$f"
          done
          plutil -lint "$kit/service.plist"
          rc=0
          "$kit/ensure-camera-access.sh" --check || rc=$?
          if [ "$rc" != 10 ]; then
            echo "::error::ensure-camera-access.sh --check ended with $rc, expected 10 (not installed)"
            exit 1
          fi
          rc=0
          "$kit/install-camera-access.sh" --dry-run --root "$PWD/build/ci/usbd-root" \
            --source "$app/Contents/Helpers" --source "$kit" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::warning::the camera service installer reported trust failures for the runner's folders (dry run)"
          elif [ "$rc" != 0 ]; then
            echo "::error::install-camera-access.sh --dry-run ended with $rc"
            exit 1
          fi
          installed="build/ci/usbd-root/Library"
          cmp "$usbd" "$installed/PrivilegedHelperTools/$label"
          test -f "$installed/LaunchDaemons/$label.plist"
          test "$(plutil -extract DaemonCDHash raw "$installed/Application Support/$label/usbd.plist")" \
            = "$(plutil -extract DaemonCDHash raw "$kit/service.plist")"
          # Shipped binaries must not contain absolute build paths (they carry the builder's user name): __FILE__ in
          # C/C++ code, the linker's debug map (bundle-app.sh strips it). -a: macOS grep skips binary files otherwise.
          if grep -rlaF "$HOME/" "$app/Contents"; then
            echo "::error::absolute build paths in the app bundle (files above)"
            exit 1
          fi
          for exe in IntelFaceScan ifscan; do
            # (no grep -q: an early exit would make nm fail with SIGPIPE and pipefail hide the match)
            if nm -ap "$app/Contents/MacOS/$exe" | grep ' OSO ' > /dev/null; then
              echo "::error::Contents/MacOS/$exe still has the linker's debug map (object file paths)"
              exit 1
            fi
          done
          ls build/dSYMs/IntelFaceScan.dSYM build/dSYMs/ifscan.dSYM > /dev/null
          build/helper/tests/make-test-recording -o build/ci/bundle/rec.db3 --frames 10 --fast
          # From a folder without build/helper: ifscan must find the helper inside the bundle.
          cd build/ci/bundle
          "$app/Contents/MacOS/ifscan" synth -o bundle.ifsdataset --width 320 --height 200 --frames-per-pose 1
          "$app/Contents/MacOS/ifscan" info rec.db3 | tee rec.txt
          grep -q 'depth 0: z16 1280x720' rec.txt
          ditto -c -k --keepParent "$app" ../../IntelFaceScan.zip

      - name: Upload the app bundle
        if: hashFiles('build/IntelFaceScan.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: IntelFaceScan-${{ github.sha }}
          path: build/IntelFaceScan.zip
          if-no-files-found: warn
          retention-days: 14
